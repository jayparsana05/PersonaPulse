# ============================================================
# PersonaPulse – Keepalive / Canary Workflow
# ============================================================
# Runs two maintenance tasks on a daily schedule:
#
#   1. LinkedIn Token Canary – alerts via Telegram if the
#      LinkedIn OAuth token is within 5 days of expiry.
#
#   2. Stale Draft Cleanup – calls cleanup_stale_drafts() via
#      Supabase RPC to auto-reject PENDING drafts older than 24h.
#
# Schedule: Daily at 08:00 UTC.
# ============================================================

name: "PersonaPulse – Daily Keepalive & Canary"

on:
  schedule:
    # Daily at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch: {}   # Allow manual trigger

jobs:
  keepalive:
    name: "Token Canary + Stale Draft Cleanup"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GEMINI_API_KEY:              ${{ secrets.GEMINI_API_KEY }}
      TAVILY_API_KEY:              ${{ secrets.TAVILY_API_KEY }}
      SUPABASE_URL:                ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN:          ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:            ${{ secrets.TELEGRAM_CHAT_ID }}
      LINKEDIN_ACCESS_TOKEN:       ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_AUTHOR_URN:         ${{ secrets.LINKEDIN_AUTHOR_URN }}
      LINKEDIN_TOKEN_EXPIRY_DATE:  ${{ secrets.LINKEDIN_TOKEN_EXPIRY_DATE }}
      X_API_KEY:                   ${{ secrets.X_API_KEY }}
      X_API_SECRET:                ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN:              ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET:             ${{ secrets.X_ACCESS_SECRET }}

    steps:
      - name: "⬇️ Checkout repository"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "📦 Install dependencies"
        run: pip install -r requirements.txt

      - name: "🐦 Run LinkedIn Token Canary"
        # exit 0 even if canary fires a warning (non-critical)
        run: python -m src.canary || true

      - name: "🧹 Clean Up Stale Drafts via Supabase RPC"
        run: |
          python - <<'EOF'
          import os
          from supabase import create_client
          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          sb  = create_client(url, key)
          result = sb.rpc("cleanup_stale_drafts", {}).execute()
          print("Stale draft cleanup complete:", result)
          EOF
